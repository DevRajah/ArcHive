services:
  archive-postgres:
    image: postgres:16
    container_name: archive-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive
    ports:
      - "5434:5432"
    volumes:
      - archive_postgres_data:/var/lib/postgresql/data

volumes:
  archive_postgres_data: