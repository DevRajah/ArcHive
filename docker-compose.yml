services:
  archive-postgres:
    image: postgres:16
    container_name: archive-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive
    ports:
      - "5434:5432"
    volumes:
      - archive_postgres_data:/var/lib/postgresql/data

  archive-redis:
    image: redis:7
    container_name: archive-redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - archive_redis_data:/data

volumes:
  archive_postgres_data:
  archive_redis_data: